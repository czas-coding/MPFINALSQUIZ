<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microbiology & Infectious Disease Finals Review</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #16203a;
      --card-inner: #1e294b;
      --border: #2e3e6b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #22c55e;
      --error: #ef4444;
      --success-bg: rgba(34, 197, 94, 0.15);
      --error-bg: rgba(239, 68, 68, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Watermark */
    .bg-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-25deg);
      font-size: clamp(6rem, 18vw, 15rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.025);
      user-select: none;
      pointer-events: none;
      z-index: 0;
      white-space: nowrap;
    }

    /* Floating Corner Badge */
    .floating-watermark {
      position: fixed;
      bottom: 1rem;
      right: 1.25rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.55);
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(6px);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      user-select: none;
      pointer-events: none;
      z-index: 9999;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.25rem;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 1;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #fff;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    .tagline {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .signature {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 2rem;
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--accent);
      color: #0b1329;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 1.8rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--card-inner);
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .grid-branches {
      display: grid;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .branch-card {
      background: var(--card-inner);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 0.5rem;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background-color 0.2s;
      color: var(--text);
      width: 100%;
    }

    .branch-card:hover {
      border-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.08);
    }

    .branch-card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.35rem;
      color: #fff;
    }

    .branch-card p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .option-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      text-align: left;
      font-size: 0.975rem;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    .option-btn.correct {
      border-color: var(--success) !important;
      background-color: var(--success-bg) !important;
      color: #4ade80 !important;
      font-weight: 600;
    }

    .option-btn.incorrect {
      border-color: var(--error) !important;
      background-color: var(--error-bg) !important;
      color: #f87171 !important;
    }

    .explanation-box {
      background: #0d1527;
      border-left: 4px solid var(--accent);
      border-radius: 0 0.5rem 0.5rem 0;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.925rem;
      line-height: 1.5;
    }

    .explanation-box.hidden {
      display: none;
    }

    .explanation-box strong {
      color: var(--accent);
      display: block;
      margin-bottom: 0.25rem;
    }

    .nav-bar {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .score-box {
      text-align: center;
      padding: 2.5rem 1rem;
    }

    .score-badge {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Subtle Fullscreen Watermark -->
  <div class="bg-watermark">JCPR</div>

  <!-- Subtle Floating Corner Tag -->
  <div class="floating-watermark">✦ Reviewer by JCPR</div>

  <main class="container">
    <!-- Home Landing Page -->
    <section id="view-home" class="view active">
      <h1>WELCOME!</h1>
      <p class="tagline">GOODLUCK SA FINALS TODAY!</p>
      <div class="signature">- JCPR</div>
      <button class="btn" onclick="showBranchSelect()">Start</button>
    </section>

    <!-- Branch / Module Selection View -->
    <section id="view-branches" class="view">
      <h2>Select Quiz Branch</h2>
      <p style="color: var(--text-muted); margin-bottom: 1rem;">Choose a specific topic branch or challenge the complete question bank:</p>
      
      <div class="grid-branches">
        <button class="branch-card" onclick="startQuiz('all')">
          <h3>Full Practice Exam</h3>
          <p>Complete 132-question bank spanning all chapters and topics</p>
        </button>
        <button class="branch-card" onclick="startQuiz('part1')">

          <p>Questions 1–20: Portals of entry/exit, virulence, endotoxins vs exotoxins, ID50</p>
        </button>
        <button class="branch-card" onclick="startQuiz('part2')">
          <h3>Part II: NRS103 Microbiology Comprehensive Series</h3>
          <p>Questions 21–60: Leukopenia, microbial antagonism, normal flora, bacterial enzymes</p>
        </button>
        <button class="branch-card" onclick="startQuiz('part3')">
          <h3>Part III: Respiratory Infections (TB, Flu, & Strep)</h3>
          <p>Questions 61–91: Active vs latent TB, airborne precautions, influenza antiviral timing, scarlet fever</p>
        </button>
        <button class="branch-card" onclick="startQuiz('part4')">
          <h3>Part IV: Virology & Parasitology (HIV, HBV, Ebola, Malaria)</h3>
          <p>Questions 92–132: HIV viral life cycle, serology interpretation, Ebola care, Plasmodium stages</p>
        </button>
      </div>
      <button class="btn btn-secondary" onclick="showView('view-home')">Back to Home</button>
    </section>

    <!-- Interactive Quiz View -->
    <section id="view-quiz" class="view">
      <div class="quiz-header">
        <span id="quiz-branch-tag">Quiz Branch</span>
        <span id="quiz-counter">Question 1 of 132</span>
      </div>

      <div class="question-title" id="quiz-question-text">Question prompt</div>
      <div class="options-list" id="quiz-options-container"></div>

      <div class="explanation-box hidden" id="quiz-explanation-box">
        <strong id="quiz-result-title">Rationalization</strong>
        <span id="quiz-explanation-text"></span>
      </div>

      <div class="nav-bar">
        <button class="btn btn-secondary" onclick="prevQuestion()" id="btn-prev">Previous</button>
        <button class="btn" onclick="nextQuestion()" id="btn-next">Next</button>
      </div>
      <button class="btn btn-secondary" style="margin-top: 0.75rem;" onclick="showBranchSelect()">Change Branch</button>
    </section>

    <!-- Results Screen -->
    <section id="view-results" class="view">
      <div class="score-box">
        <h2>Quiz Completed!</h2>
        <div class="score-badge" id="results-score">0 / 0</div>
        <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;" id="results-message"></p>
        <button class="btn" onclick="showBranchSelect()">Select Another Branch</button>
        <button class="btn btn-secondary" style="margin-top: 0.75rem;" onclick="showView('view-home')">Return to Home</button>
      </div>
    </section>
  </main>

  <script>
    const quizData = [
      // Part I: Questions 1–20
      {
        part: "part1",
        q: "Which of the following is not a normal portal of exit for an infectious disease?",
        options: ["A. Removal of blood", "B. Skin flakes and secretions", "C. All of these are normal exit portals", "D. Respiratory droplets", "E. Urogenital tract secretions"],
        answer: 2,
        exp: "Removal of blood (via insect bites or needles), skin, the urogenital tract, feces, and respiratory droplets from coughing/sneezing are all standard portals of exit used by pathogens to leave a host."
      },
      {
        part: "part1",
        q: "Which of the following is not an antiphagocytic factor?",

        answer: 0,
        exp: "Adherence factors assist in attachment, whereas capsules, leukocidins, and slime layers actively prevent engulfment or destruction by phagocytes."
      },
      {

        q: "Microbial hyaluronidase, coagulase, and streptokinase are examples of:",
        options: ["A. Endotoxins", "B. Exoenzymes", "C. Antiphagocytic proteins", "D. Structural ribosomes"],
        answer: 1,
        exp: "These are exoenzymes secreted by pathogens to break down host barriers and evade defenses."
      },
      {
        part: "part1",
        q: "Virulence factors include all of the following except:",
        options: ["A. Capsules", "B. Exoenzymes", "C. Endotoxins", "D. Ribosomes"],
        answer: 3,
        exp: "Ribosomes are primary cellular organelles required for protein translation, not specialized virulence determinants."
      },
      {
        part: "part1",
        q: "Hyaluronidase is a virulence factor found in:",
        options: ["A. Clostridia", "B. Prions", "C. Protozoa", "D. Archaea"],
        answer: 0,
        exp: "Hyaluronidase is found in Clostridia, staphylococci, streptococci, and pneumococci."
      },
      {
        part: "part1",
        q: "Virulence differs from pathogenicity in that pathogenicity describes the ability of an organism to cause disease, whereas virulence describes the degree of pathogenicity as the disease develops.",
        options: ["A. True", "B. False"],
        answer: 0,
        exp: "Pathogenicity is the qualitative capacity to cause disease, while virulence is the quantifiable degree of damage or invasiveness."
      },
      {
        part: "part1",
        q: "Select the characteristics exhibited by exotoxins, but not exhibited by endotoxins:",
        options: [

          "C. Are non-specific in their tissue targets and stable against high heat",
          "D. Are released solely upon lysis of gram-negative outer membranes"
        ],
        answer: 0,
        exp: "Exotoxins are highly potent, targeted proteins secreted by living bacterial cells, unlike heat-stable endotoxic lipopolysaccharides."
      },
      {
        part: "part1",
        q: "Exotoxins:",
        options: [
          "A. Are integral lipopolysaccharide components of the gram-negative cell wall",

          "C. Are heat-stable glycolipids released only upon cell death",
          "D. Produce systemic responses like fever regardless of the source"
        ],
        answer: 1,
        exp: "Exotoxins are actively secreted proteins synthesized by living pathogenic bacteria."
      },
      {
        part: "part1",
        q: "_____ are toxins that are the lipopolysaccharide of the outer membrane of gram-negative cell walls.",
        options: ["A. Exoenzymes", "B. Enterotoxins", "C. Endotoxins", "D. Leukocidins"],
        answer: 2,
        exp: "Endotoxins consist of Lipopolysaccharide (specifically Lipid A) anchored in the outer membrane of gram-negative organisms."
      },
      {
        part: "part1",
        q: "An endotoxin is:",
        options: [
          "A. Indicative of gram-negative organisms",
          "B. An actively secreted polypeptide from living cells",
          "C. A toxoid used routinely in childhood vaccines",
          "D. Highly targeted to specific neural tissue"
        ],
        answer: 0,
        exp: "Endotoxins are characteristic structural components of the outer membrane of gram-negative bacteria."
      },
      {
        part: "part1",
        q: "The term infection refers to:",
        options: [
          "A. Pathogens penetrating host defenses",
          "B. Contact with sterile host tissue",
          "C. Physical damage caused by mechanical trauma",
          "D. Total clearance of microorganisms by the immune response"
        ],
        answer: 0,
        exp: "Infection is defined as the entry, establishment, and penetration of host defenses by pathogenic microbes."
      },
      {
        part: "part1",
        q: "The minimum amount of microbes in the inoculating dose is the:",
        options: ["A. Lethal dose 50 (LD50)", "B. Minimum bactericidal concentration", "C. Infectious dose", "D. Toxic threshold"],
        answer: 2,
        exp: "The infectious dose (ID) is the minimum quantity of microbes required to produce an infection."
      },
      {
        part: "part1",
        q: "In a comparison of two pathogens, organism A has an infectious dose of 200,000 organisms, whereas organism B has an infectious dose of 15 organisms. This means that organism A is much more pathogenic than organism B.",
        options: ["A. True", "B. False"],
        answer: 1,
        exp: "False. Organism B requires far fewer cells to establish infection, making it significantly more virulent."
      },
      {
        part: "part1",
        q: "The cytokine storm seen in patients with severe COVID-19 is an example of a microbe causing disease in which way?",
        options: [
          "A. Secreting tissue-degrading exoenzymes",
          "B. Causing an overreaction of the host immune system",
          "C. Direct destruction of host erythrocytes",
          "D. Blocking nutrient absorption in the intestine"
        ],
        answer: 1,
        exp: "Cytokine storms represent severe indirect damage induced by an exaggerated, dysregulated host immune response."
      },
      {
        part: "part1",
        q: "The suffix -emia means:",
        options: ["A. Inflammation", "B. Blood", "C. Infection", "D. Enlargement"],
        answer: 1,
        exp: "-emia refers to conditions of the blood (e.g., bacteremia, septicemia, viremia)."
      },
      {
        part: "part1",
        q: "Resident biota are found in/on the:",
        options: [
          "A. Nasal passages, skin, mouth, and large intestine",
          "B. Blood and cerebrospinal fluid",
          "C. Liver and spleen",
          "D. Brain and spinal cord"
        ],
        answer: 0,
        exp: "Resident microbiota naturally colonize mucosal and cutaneous interfaces exposed to the external environment."
      },
      {
        part: "part1",
        q: "Under certain circumstances, members of a person's resident biota can become opportunistic pathogens.",
        options: ["A. True", "B. False"],
        answer: 0,
        exp: "True. Changes in host immunity, clearance of competing biota, or relocation to sterile sites permit commensals to cause disease."
      },
      {
        part: "part1",
        q: "Each of the following brings about inoculation of normal biota to a newborn except:",

        exp: "All listed exposures contribute directly to the initial seeding and colonization of infant flora."
      },
      {
        part: "part1",
        q: "Select the body sites that serve as portals of entry for microbes:",

          "B. Liver, spleen, and gallbladder",
          "C. Bone marrow and lymph nodes",
          "D. Heart and pericardial sac"
        ],
        answer: 0,
        exp: "Portals of entry consist of mucous membranes and cutaneous structures open directly or indirectly to the environment."
      },
      {
        part: "part1",
        q: "In an experiment to determine the infectious dose (ID50), if 100 out of 200 test mice die at a dose of 10^6 organisms, what is the ID50?",

        answer: 2,
        exp: "The ID50 is the exact dose that affects 50% of the tested population (100 out of 200 mice = 10^6 organisms)."

      // Part II: Questions 21–60

      },
      {
        part: "part2",
        q: "Infection refers to:",

          "C. Sterilization of open mucosal surfaces",

        answer: 3,
        exp: "Infection is defined as the penetration of host defense barriers by pathogenic microbes."
      },
      {
        part: "part2",
        q: "Resident biota can become opportunistic pathogens under certain circumstances.",
        options: ["A. True", "B. False"],
        answer: 0,
        exp: "True. Compromised barriers or immunosuppression can allow normal commensals to act as opportunists."
      },
      {
        part: "part2",
        q: "The degree of pathogenicity is determined by:",
        options: ["A. Latency", "B. Incubation period", "C. Virulence", "D. Host body temperature"],
        answer: 2,
        exp: "Virulence defines the degree or intensity of pathogenicity of an infectious organism."
      },
      {
        part: "part2",
        q: "The greatest number of pathogens enter the body through the:",
        options: ["A. Respiratory system", "B. Gastrointestinal tract", "C. Urogenital system", "D. Skin abrasions"],
        answer: 0,
        exp: "The respiratory tract is the most frequent portal of entry due to continuous inhalation of ambient air."
      },
      {
        part: "part2",
        q: "The suffix -emia refers to:",
        options: ["A. Tissues", "B. Intestines", "C. Blood", "D. Secretions"],

      },
      {
        part: "part2",
        q: "Which of the following is NOT an antiphagocytic factor?",

        exp: "Adherence aids physical fixation to tissues, whereas capsules and leukocidins directly defeat phagocytosis."
      },
      {
        part: "part2",
        q: "Septicemia means a pathogen is present and multiplying in the blood.",
        options: ["A. True", "B. False"],
        answer: 0,
        exp: "True. Septicemia specifically refers to active microbial replication in the bloodstream."
      },
      {
        part: "part2",
        q: "Virulence factors are:",
        options: [

        exp: "Virulence factors are microbial adaptations that promote colonisation, invasion, and damage to host tissue."
      },
      {

        q: "Infection occurs when:",
        options: [

        answer: 1,

      },
      {

      },

      },

        ],
        answer: 1,

      },

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let userSelections = {};

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function showBranchSelect() {
      showView('view-branches');
    }

    function startQuiz(partKey) {
      if (partKey === 'all') {
        currentQuestions = [...quizData];
        document.getElementById('quiz-branch-tag').textContent = "Full Practice Bank (132 Items)";
      } else {
        currentQuestions = quizData.filter(item => item.part === partKey);
        const labels = {
          part1: "Part I: Fundamental Principles (Q1–20)",
          part2: "Part II: NRS103 Series (Q21–60)",
          part3: "Part III: Respiratory Infections (Q61–91)",
          part4: "Part IV: Virology & Parasitology (Q92–132)"
        };
        document.getElementById('quiz-branch-tag').textContent = labels[partKey] || "Section Quiz";
      }

      currentIndex = 0;
      score = 0;
      userSelections = {};
      loadQuestion();
      showView('view-quiz');
    }

    function loadQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById('quiz-counter').textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
      document.getElementById('quiz-question-text').textContent = q.q;

      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';

      const expBox = document.getElementById('quiz-explanation-box');
      const alreadyAnswered = userSelections[currentIndex] !== undefined;

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = optText;

        if (alreadyAnswered) {
          btn.disabled = true;
          if (optIdx === q.answer) {
            btn.classList.add('correct');
          }
          if (userSelections[currentIndex] === optIdx && optIdx !== q.answer) {
            btn.classList.add('incorrect');
          }
        } else {
          btn.onclick = () => selectOption(optIdx);
        }

        container.appendChild(btn);
      });

      if (alreadyAnswered) {
        expBox.classList.remove('hidden');
        document.getElementById('quiz-result-title').textContent = 
          userSelections[currentIndex] === q.answer ? "✓ Correct!" : "✗ Rationalization";
        document.getElementById('quiz-explanation-text').textContent = q.exp;
      } else {
        expBox.classList.add('hidden');
      }

      document.getElementById('btn-prev').disabled = currentIndex === 0;
      document.getElementById('btn-next').textContent = 
        currentIndex === currentQuestions.length - 1 ? "Finish Quiz" : "Next";
    }

    function selectOption(selectedIdx) {
      const q = currentQuestions[currentIndex];
      userSelections[currentIndex] = selectedIdx;

      if (selectedIdx === q.answer) {
        score++;
      }

      loadQuestion();
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        loadQuestion();
      } else {
        finishQuiz();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
      }
    }

    function finishQuiz() {
      const total = currentQuestions.length;
      document.getElementById('results-score').textContent = `${score} / ${total}`;
      const percentage = Math.round((score / total) * 100);

      let msg = "";
      if (percentage >= 90) {
        msg = `Outstanding performance! You scored ${percentage}%. You are ready for finals!`;
      } else if (percentage >= 75) {
        msg = `Great job! You scored ${percentage}%. Reviewing missed rationalizations will ensure total mastery.`;
      } else {
        msg = `You scored ${percentage}%. Take another run through the questions before your exam!`;
      }
      document.getElementById('results-message').textContent = msg;
      showView('view-results');
    }
